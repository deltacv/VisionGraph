plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.google.devtools.ksp' version '2.3.4'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.10'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'signing'
    id "com.vanniktech.maven.publish"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

components.java {
    tasks.named("shadowJar").configure {
        // only run shadowJar when explicitly specified by the user
        // check if user invoked gradle with :shadowJar
        enabled = project.gradle.startParameter.taskNames.contains("shadowJar")
        archiveFileName = "VisionGraphPlugin-${project.version}-all.jar"
    }

    tasks.named("jar").configure {
        archiveFileName = "VisionGraphPlugin-${project.version}.jar"
    }
}

tasks.register('generatePluginToml') {
    // Use layout.buildDirectory for the output directory
    def outputFile = layout.buildDirectory.file("resources/main/plugin.toml")

    outputFile.get().asFile.delete()
    outputs.file(outputFile) // Mark this file as an output of the task

    doLast {
        def templateFile = new File(project.projectDir, "src/main/plugin.toml")

        // Read the template file
        def template = templateFile.text

        // Replace the placeholder with the project version
        def replaced = template.replace("{{version}}", project.version.toString())

        // Write to the output file
        outputFile.get().asFile.parentFile.mkdirs() // Ensure the directory exists
        outputFile.get().asFile.text = replaced
    }
}

configurations {
    signingTool {
        canBeConsumed = false
        canBeResolved = true
    }
}

tasks.register('signPlugin', JavaExec) {
    def signingKey = System.getenv('PLUGINSIGNING_PRIVATE') ?: findProperty('pluginSigningPrivate')
    if (!signingKey) {
        enabled = false
    }

    def jarTask = tasks.named('jar', Jar).get()
    def shadowJarTask = tasks.named('shadowJar').get()

    dependsOn jarTask
    if (shadowJarTask.enabled) {
        dependsOn shadowJarTask
    }

    classpath = files(configurations.signingTool)
    mainClass = 'org.deltacv.eocvsim.plugin.security.PluginSigningTool'
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }.get())

    doFirst {
        def pluginJar = shadowJarTask.enabled ? shadowJarTask.archiveFile.get().asFile : jarTask.archiveFile.get().asFile
        args = [
                "--plugin=${pluginJar}",
                '--authority=deltacv',
                "--key=${signingKey}"
        ]
        println("Signing plugin. Using tool classpath: ${configurations.signingTool.asPath} and plugin jar: ${pluginJar}")
    }
}

tasks.named("processResources").configure {
    dependsOn generatePluginToml
}

// Maven metadata task should depend on signPlugin if it exists
tasks.configureEach {
    if (name == "generateMetadataFileForMavenPublication") {
        dependsOn signPlugin
    }
}

shadowJar {
    configurations = [project.configurations.runtimeClasspath]

    exclude "kotlin/**"
    exclude "org/jetbrains/kotlin/**"
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
    exclude "android/"
    exclude "androidx/"
    exclude "dalvik/"
    exclude "libcore/"
}

configurations.configureEach {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
    }
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes['Main-Class'] = 'org.deltacv.papervision.plugin.EOCVSimIpcPaperVisionMain'
    }
}

shadowJar {
    exclude "nu/pattern/*"
    exclude "*.so"
    exclude "*.dylib"
    exclude "*.dll"
}

dependencies {
    implementation project(":LwjglPlatform")

    compileOnly "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinx_serialization_version"
    implementation "com.google.code.gson:gson:$gson_version" // TODO: we'll get rid of it soon enough

    implementation "ch.qos.logback:logback-classic:$logback_classic_version"

    // compileOnly("org.deltacv.EOCV-Sim:EOCV-Sim:$eocvsim_version") { transitive = false }
    compileOnly("org.deltacv.EOCV-Sim:Common:$eocvsim_version") { transitive = false }
    signingTool("org.deltacv.EOCV-Sim:Common:$eocvsim_version")
    compileOnly("org.deltacv.EOCV-Sim:Vision:$eocvsim_version")

    compileOnly "org.openpnp:opencv:4.9.0-0"

    // ugh, coroutines, an internal method call of EOCV-Sim in PaperVisionTabPanel returns a Job
    // and the compiler freaks out if we don't have it accessible during compile time, we can make
    // it with only compileOnly since at runtime EOCV-Sim already has coroutines included
    compileOnly("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2")

    implementation 'org.codehaus.janino:janino:3.1.12'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'info.picocli:picocli:4.7.6'

    implementation "org.deltacv:mackjpeg:$mackjpeg_version"

    ksp project(":AnnotationProcessor")
}

ksp {
    arg("moduleName", "EOCVSimPlugin")
    arg("polymorphicSerializableMetadataPackage", "org.deltacv.visiongraph.serialization.generated")
}